name: Configurator contract tests

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/pricing/**'
      - 'prisma/seed/data/06-configurators/**'
      - 'tests/configurator-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/configurator-tests.yml'
  pull_request:
    paths:
      - 'src/lib/pricing/**'
      - 'prisma/seed/data/06-configurators/**'
      - 'tests/configurator-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/configurator-tests.yml'
  workflow_dispatch:

jobs:
  configurator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
